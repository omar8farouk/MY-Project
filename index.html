<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/mince-logo-square.svg" />
    <title>Mince Burgers - Egypt</title>
    <meta name="description" content="Official web ordering application for Mince Burgers Egypt with branch geolocation routing, burger customization engine, smart cart cross-sell, dynamic checkout, and WhatsApp/KDS dispatch." />
    <meta property="og:title" content="Mince Burgers - Egypt" />
    <meta property="og:description" content="Official web ordering application for Mince Burgers Egypt with branch geolocation routing, burger customization engine, smart cart cross-sell, dynamic checkout, and WhatsApp/KDS dispatch." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mince_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-500 selection:text-white dark:bg-stone-950 dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
